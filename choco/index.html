<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choco Merge — Download</title>
<meta name="description" content="Choco Merge: swipe, merge, make chocolate. Free on iPhone & Android.">
<meta property="og:title" content="Choco Merge — free on iPhone & Android">
<meta property="og:description" content="Swipe, merge, make chocolate. A cozy merge puzzle by a solo indie dev.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#2a1608; --card:#3b2010; --ink:#fff7ec; --muted:#e9cfae; --accent:#ffb347; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 20%, #5a2f12, var(--bg) 70%); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:24px; padding:32px 24px;
         text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 6px; font-size:2rem; letter-spacing:.5px; }
  p { margin:0 0 24px; color:var(--muted); line-height:1.45; }
  a.btn { display:block; margin:12px 0; padding:16px; border-radius:14px; text-decoration:none;
          font-weight:700; font-size:1.05rem; color:#2a1608; background:var(--accent); }
  a.btn.alt { background:#fff7ec; }
  small { display:block; margin-top:18px; color:var(--muted); opacity:.8; }
</style>
</head>
<body>
<main>
  <h1>🍫 Choco Merge</h1>
  <p id="tag">Swipe, merge, make chocolate.<br>Free on iPhone &amp; Android.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6828130577">Download on the App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.cagverse.chocomerge">Get it on Google Play</a>
  <small id="by">Made by a solo indie dev · CagVerse</small>
</main>
<script>
(function () {
  // ?s=ig / tt / yt / fb / x / th / rd / baba ... -> kanal etiketi (yalnızca güvenli karakterler)
  var q = new URLSearchParams(location.search);
  var s = (q.get("s") || "direct").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 20) || "direct";
  // Dil: ?l=tr / ?l=en zorlar; yoksa tarayıcı dili Türkçe ise Türkçe
  var l = (q.get("l") || "").toLowerCase();
  var tr = l ? l === "tr" : /^tr\b/i.test(navigator.language || "");
  if (tr) {
    document.documentElement.lang = "tr";
    document.title = "Choco Merge — İndir";
    document.getElementById("tag").innerHTML = "Kaydır, birleştir, çikolata yap.<br>iPhone ve Android'de ücretsiz.";
    document.getElementById("ios").textContent = "App Store'dan İndirin";
    document.getElementById("android").textContent = "Google Play'den Alın";
    document.getElementById("by").textContent = "Tek başına çalışan bağımsız bir geliştiriciden · CagVerse";
  }
  // pt = App Store Connect sağlayıcı kodu (Campaign Link Generator), ct = kampanya etiketi
  var ios = "https://apps.apple.com/app/id6828130577?pt=129692221&ct=" + s + "&mt=8";
  var android = "https://play.google.com/store/apps/details?id=com.cagverse.chocomerge&referrer=" +
                encodeURIComponent("utm_source=" + s + "&utm_medium=social&utm_campaign=smartlink");
  document.getElementById("ios").href = ios;
  document.getElementById("android").href = android;
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) location.replace(ios);
  else if (isAndroid) location.replace(android);
})();
</script>
</body>
</html>
